name: Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

# Fleet standard: every job runs on the bw-tools self-hosted runner
# (100.77.138.14) with the explicit `bw-tools` label. Before this workflow
# existed, no pipeline ran the PHP or JavaScript suites at all: the release
# script only ran `npm test`, and nothing ran on a pull request.
jobs:
  php-tests:
    runs-on: [self-hosted, linux, x64, bw-tools]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, bcmath, gd, zip
          coverage: none
          ini-values: xdebug.mode=off

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run PHP test suite
        # Xdebug's develop mode segfaults inside its exception hook when
        # Mockery throws (fetch_zval_from_symbol_table). It is a debugger, not
        # part of the test contract, so it stays off in CI.
        run: php -d xdebug.mode=off vendor/bin/phpunit

  js-tests:
    runs-on: [self-hosted, linux, x64, bw-tools]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run JavaScript and CLI test suites
        run: npm test
