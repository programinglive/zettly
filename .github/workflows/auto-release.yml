name: Auto Release on PR Merge

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write

# Fleet standard: every job runs on the bw-tools self-hosted runner
# (100.77.138.14) with the explicit `bw-tools` label.
jobs:
  auto-release:
    if: github.event.pull_request.merged == true && (startsWith(github.event.pull_request.head.ref, 'agent/') || startsWith(github.event.pull_request.title, 'feat(agent):'))
    runs-on: [self-hosted, linux, x64, bw-tools]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      - name: Bump Version and Create Tag
        run: npm run release:patch

      - name: Push release commit and tags
        run: git push --follow-tags origin main
