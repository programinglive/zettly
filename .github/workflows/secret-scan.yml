name: Secret Scan

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

# Prevent credentials from entering the public repository again. A leaked
# Gemini API key once reached public history via .env.testing; a forward-only
# cleanup could not remove it from already-published commits. This job scans
# the full history and fails on any NEW secret. Known historical findings are
# acknowledged in .gitleaksignore and stay ignored until history is rewritten.
jobs:
  gitleaks:
    runs-on: [self-hosted, linux, x64, bw-tools]
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.30.1 \
            detect --no-banner --redact \
            --gitleaks-ignore-path /repo/.gitleaksignore
