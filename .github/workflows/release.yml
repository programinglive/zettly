name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Fleet standard: every job runs on the bw-tools self-hosted runner
# (100.77.138.14) with the explicit `bw-tools` label.
jobs:
  release:
    runs-on: [self-hosted, linux, x64, bw-tools]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            public/build/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
